name: CI/CD Pipeline - ZK-ML Mental Health

on:
  push:
    branches:
      - prod-group-1
  workflow_dispatch:

env:
  DOCKER_IMAGE: asree001/zkp_mental-api

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build & Verify Docker Image
  # หาก Job นี้มี Error เกิดขึ้น ระบบจะหยุดทำงานทันที และจะไม่ข้ามไป Push/Deploy
  # ---------------------------------------------------------------------------
  build:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true # โหลด Image เข้า Docker Daemon ทันทีเพื่อนำไปทดสอบ
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Save Docker Image as Tar Artifact
        run: |
          docker save ${{ env.DOCKER_IMAGE }}:latest ${{ env.DOCKER_IMAGE }}:${{ github.sha }} -o /tmp/zkp_mental_api.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-artifact
          path: /tmp/zkp_mental_api.tar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 2: Push Docker Image to Docker Hub (ทำงานเมื่อ Job build ผ่านเท่านั้น)
  # ---------------------------------------------------------------------------
  push:
    name: Push Docker Image to Docker Hub
    runs-on: ubuntu-latest
    needs: build # 🛑 ถ้า Job build ล้มเหลว Job นี้จะถูกยกเลิก (Skipped) อัตโนมัติ

    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact
          path: /tmp

      - name: Load Docker Image into Daemon
        run: |
          docker load -i /tmp/zkp_mental_api.tar
          docker images

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Images to Docker Hub
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:latest
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  # ---------------------------------------------------------------------------
  # Job 3: Deploy to Production Server via SSH (ทำงานเมื่อ Job push สำเร็จเท่านั้น)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: push # 🛑 ถ้า Job push ล้มเหลว Job นี้จะถูกยกเลิก (Skipped) อัตโนมัติ

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "🚀 Starting Deployment on Server..."
            cd ${{ secrets.SERVER_DEPLOY_PATH || '/root/api' }}

            echo "📦 Pulling latest Docker image (${{ env.DOCKER_IMAGE }}:latest)..."
            docker compose pull api

            echo "🔄 Updating API container..."
            docker compose up -d api

            echo "🧹 Cleaning up old unused Docker images..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"
