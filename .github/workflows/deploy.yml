name: CI Pipeline - ZK-ML Mental Health

on:
  push:
    branches:
      - prod-group-1
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE: asree001/zkp_mental-api

jobs:
  # ---------------------------------------------------------------------------
  # CI: Build, Test & Push Docker Image to Docker Hub
  # (ส่วน CD จะถูกจัดการโดย Watchtower บน Server อัตโนมัติเมื่อมี Image ใหม่)
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: CI Completed Notification
        run: |
          echo "🎉 Docker image pushed successfully to Docker Hub!"
          echo "🏷️ Tags: ${{ env.DOCKER_IMAGE }}:latest, ${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
          echo "🚀 Watchtower on the server will automatically detect and pull this new image."
