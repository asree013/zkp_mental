version: '3.8'

services:
  # 1. FastAPI ZK-ML Backend Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zkp_mental_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=default-db
      - DB_USER=root
      - DB_PASSWORD=12345678
      - DATABASE_URL=mysql+pymysql://root:12345678@db:3306/default-db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zkp_network

  # 2. MySQL Database Service
  db:
    image: mysql:8.0
    container_name: zkp_mental_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=12345678
      - MYSQL_DATABASE=default-db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p12345678"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - zkp_network

networks:
  zkp_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
